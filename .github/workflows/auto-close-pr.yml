name: Auto Close Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR if conditions are met
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prTitle = pr.title.toLowerCase();
            const author = pr.user.login;

            let shouldClose = false;
            let closeReasons = [];

            // Condition 1: Close PRs with "[WIP]" or "WIP:" in the title
            if (prTitle.includes('[wip]') || prTitle.startsWith('wip:')) {
              shouldClose = true;
              closeReasons.push('This PR appears to be a Work in Progress (WIP). Please remove "[WIP]" or "WIP:" from the title when ready for review.');
            }

            // Condition 2: Close PRs with empty body/description
            if (!pr.body || pr.body.trim() === '') {
              shouldClose = true;
              closeReasons.push('This PR lacks a description. Please add a meaningful description explaining your changes.');
            }

            if (shouldClose) {
              const closeReason = closeReasons.join('\n\n');
              // Add a comment explaining why the PR was closed
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `👋 Hello @${author},\n\n${closeReason}\n\nIf you believe this was closed in error, please reach out to the maintainers.`
              });

              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed'
              });

              console.log(`PR #${prNumber} has been closed. Reason: ${closeReason}`);
            } else {
              console.log(`PR #${prNumber} passed all checks and will remain open.`);
            }
